# Required secrets:
# OV_AUTOMATION_PAT_READ_PACKAGES - Access token to read GitHub Packages in the module-test-actions, scmdb and IKAMTeam repositories
# OV_MODULES_LIBRARY_TOKEN - ModulesLibraryToken parameter value

# Optional secrets:
# OV_GOOGLE_MAPS_API_KEY - Google Maps API key

# Required variables:
# OV_EKS_SERVICE_NAMESPACE - Name of service namespace in K8S
# OV_MODULES_LIBRARY_REPOSITORY_ACCOUNT - ModulesLibraryRepositoryAccount parameter value
# OV_UI_TEST_DB_PASSWORD - Oracle schemas password in DB container
# OV_UI_TEST_NODEGROUP_CONFIG - {"services": "", "db": "", "selenium-hub": "", "selenium-node": ""}
# OV_UI_TEST_WEB_USERNAME - VizionPlatform user for module tests
# OV_UI_TEST_WEB_PASSWORD - VizionPlatform users password

name: Module tests
on:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to run tests (chrome/firefox)
        type: choice
        options:
          - firefox
          - chrome
        required: true
      platform_version:
        description: ov-platform artifacts version
        type: string
        required: true
        default: LATEST-SNAPSHOT
      ui_test_db_package_version:
        description: DB package (docker image) version
        type: string
        required: true
        default: latest
      module_version:
        description: Specific module version to install
        type: string
        required: false

jobs:
  run_module_tests:
    uses: ov-integrations/module-test-actions/.github/workflows/run-module-test.yml@v1
    with:
      browser: ${{ inputs.browser }}
      platform_version: ${{ inputs.platform_version }}
      ui_test_db_package_version: ${{ inputs.ui_test_db_package_version }}
      module_version: ${{ inputs.module_version }}
      source_git_ref_module_test_actions: v1
    secrets: inherit
